<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4B4" />
      <stop offset="100%" stop-color="#00796B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#004D40" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#grad)" />
  
  <!-- Compass / Route Pin Path -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Airplane / Navigation Arrow Icon (Travel Connect logo) -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)" filter="url(#shadow)">
    <path d="M430 82L230 282" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M430 82L304 430L230 282L82 208L430 82Z" fill="#FFFFFF" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="230" cy="282" r="14" fill="#00796B"/>
  </g>
</svg>
